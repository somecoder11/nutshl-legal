<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutshl Legal Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #818cf8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card);
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
    p { color: var(--muted); margin-bottom: 2rem; }
    .btn {
      display: block;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--primary);
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      background: rgba(129, 140, 248, 0.15);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">app.nutshl.audio</span>
    <h1>Nutshl Legal Hub</h1>
    <p>Official legal documents and compliance declarations for the Nutshl mobile application.</p>
    <a href="privacy.html" class="btn">Privacy Policy &amp; Data Rights</a>
    <a href="terms.html" class="btn">Terms of Service</a>
  </div>
</body>
</html>
